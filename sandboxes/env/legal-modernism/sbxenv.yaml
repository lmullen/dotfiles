schemaVersion: "1"
name: legal-modernism
agent: claude
workspace: /Users/lmullen/github/chnm/legal-modernism
kits: 
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/claude-config
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/lmullen-agent
  # Toolchains through mise. The versions (Go, dbmate, Hugo) are pinned in
  # legal-modernism's own mise.toml; mise-shims installs them at create and
  # makes them visible to Claude's Bash tool.
  - docker.io/sbx/mise:latest
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/mise-shims
  # What mise cannot install well comes from apt. tzdata: Hugo's release
  # binaries embed no time zone database, so named zones fail without it.
  - source: /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/apt-packages
    args:
      packages: "postgresql-client poppler-utils librsvg2-bin tzdata"
  # Docker's official Playwright kit: headless Chromium plus the playwright
  # CLI. Its install hook adds apt's Node 24 for its own use if there is no
  # node on PATH yet; in shells, mise's node comes first.
  - docker.io/sbx/playwright:latest
  # Docker's official Lighthouse kit, for auditing the site served in the
  # sandbox. Same Node arrangement as playwright.
  - docker.io/sbx/lighthouse:latest
# Passed from the host's LAW_CLAUDE at creation via `--env-arg` (see Makefile).
args:
  LAW_CLAUDE:
    required: true
    description: Value of the host's LAW_CLAUDE environment variable
env:
  LAW_CLAUDE: "${{ env.args.LAW_CLAUDE }}"
ports:
  - sandbox: 4313
    host: 4313
  - sandbox: 4314
    host: 4314
  - sandbox: 4315
    host: 4315
  - sandbox: 4316
    host: 4316
