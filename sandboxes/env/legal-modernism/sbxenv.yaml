schemaVersion: "1"
name: legal-modernism
agent: claude
workspace: /Users/lmullen/github/chnm/legal-modernism
kits: 
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/claude-statusline
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/claude-light-theme
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/lmullen-agent
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/go
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/psql
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/remote-control
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/node
  # Docker's official Playwright kit: headless Chromium plus the playwright
  # CLI. It needs Node, which the node kit above supplies.
  - docker.io/sbx/playwright:latest
  # Docker's official Lighthouse kit, for auditing the site served in the
  # sandbox. Like playwright, it needs the node kit's Node.
  - docker.io/sbx/lighthouse:latest
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/pdf-tools
  # Hugo for website/, pinned to the version in website/Dockerfile.
  - source: /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/hugo
    args:
      version: "0.161.1"
# Passed from the host's LAW_CLAUDE at creation via `--env-arg` (see Makefile).
args:
  LAW_CLAUDE:
    required: true
    description: Value of the host's LAW_CLAUDE environment variable
env:
  LAW_CLAUDE: "${{ env.args.LAW_CLAUDE }}"
ports:
  - sandbox: 4313
    host: 4313
  - sandbox: 4314
    host: 4314
  - sandbox: 4315
    host: 4315
  - sandbox: 4316
    host: 4316
