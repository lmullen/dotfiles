schemaVersion: "1"
name: legal-modernism
agent: claude
workspace: /Users/lmullen/github/chnm/legal-modernism
kits: 
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/claude-statusline
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/lmullen-agent
  - docker.io/sbx/mise:latest
# Host values passed in at creation with --env-arg (`make sandboxes` passes
# each from the host variable of the same name; see SANDBOX_HOST_ENV).
args:
  LAW_CLAUDE:
    required: true
    description: Value of the host's LAW_CLAUDE environment variable
env:
  LAW_CLAUDE: "${{ env.args.LAW_CLAUDE }}"
ports:
  - sandbox: 4313
    host: 4313
  - sandbox: 4314
    host: 4314
  - sandbox: 4315
    host: 4315
  - sandbox: 4316
    host: 4316
