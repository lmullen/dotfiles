schemaVersion: "1"
name: lincolnmullen.com
agent: claude
workspace: /Users/lmullen/github/lmullen/lincolnmullen.com
additionalWorkspaces:
  - path: /Users/lmullen/github/lmullen/projects.lincolnmullen.com
  - path: /Users/lmullen/github/lmullen/domesday
  - path: /Users/lmullen/notes/writing/blog
    readOnly: true
kits: 
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/claude-config
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/lmullen-agent
  # Toolchains through mise. The versions (Hugo, Node) are pinned in
  # lincolnmullen.com's own .mise.toml; mise-shims installs them at create and
  # makes them visible to Claude's Bash tool.
  - docker.io/sbx/mise:latest
  - /Users/lmullen/github/lmullen/dotfiles/sandboxes/kits/mise-shims
  # Docker's official Lighthouse kit, for auditing the site served in the
  # sandbox. Its install hook adds apt's Node 24 for its own use if there is
  # no node on PATH yet; in shells, mise's node comes first.
  - docker.io/sbx/lighthouse:latest
ports:
  - sandbox: 1313
    host: 1313
  - sandbox: 1314
    host: 1314
  - sandbox: 1315
    host: 1315
  - sandbox: 1316
    host: 1316
