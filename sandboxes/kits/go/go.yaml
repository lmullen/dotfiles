# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit (schema v3 mixin) that gives a sandbox a Go toolchain
# from the Docker Hardened Images apt repository (dhi.io) the claude workload
# already has configured. dhi.io carries one package per Go minor line
# (golang-1.26, golang-1.27, ...); each tracks that line's latest patch
# release, so a sandbox create gets the newest 1.27.x.
#
# There is no official Go kit in docker/sbx-kits-contrib (its answer for
# language toolchains is the mise kit, which these sandboxes no longer use).
#
# Like the psql and node kits, this is an apt install hook: apt packages need
# the composed base's dpkg database and cannot travel in an overlay.
# Declaration-only, so there is no dockerfile.
#
# TO MOVE TO A NEW GO MINOR: change golang-1.27 in the hook and go@1.27 in
# `provides` together. `apt-cache search --names-only '^golang-1'` inside a
# sandbox lists what dhi.io has.
schemaVersion: "3"
kind: mixin
version: "2.0.0"
displayName: Go toolchain
description: >-
  Installs Go 1.27 (latest patch release) from the dhi.io apt repository at
  sandbox create, and allows the Go module proxy and checksum database at
  runtime so `go mod download`, `go build` and `go test` can fetch
  dependencies.
sourceUrl: https://github.com/lmullen/dotfiles

provides: ["go@1.27"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # apt during install: `apt-get update` refreshes every configured source.
      install:
        allow:
          - deb.debian.org
          - dhi.io
      # What a Go toolchain reaches at runtime: the module proxy and the
      # checksum database that verifies what it serves.
      runtime:
        allow:
          - proxy.golang.org
          - sum.golang.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # golang-1.27 installs the tree at /usr/lib/go and links go and gofmt
        # into /usr/bin. Its Depends (gcc, libc6-dev, binutils) make cgo work.
        # The proxy variables are declared because v3 hook environments are
        # deny-by-default and apt needs them to fetch.
        - command: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends golang-1.27
            rm -rf /var/lib/apt/lists/*
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, NO_PROXY, no_proxy]
          description: Install Go 1.27 from the dhi.io apt repository

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./go-context.md
