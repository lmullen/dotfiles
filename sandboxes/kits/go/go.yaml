# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit (schema v3 mixin) that gives a sandbox a Go toolchain.
#
# Go is content: the official release tarball from dl.google.com is a
# self-contained tree with nothing create-time in it, so go.dockerfile
# downloads it on the builder, checks its digest and ships it as an overlay at
# /usr/local/go. No per-create download, a pinned release in a scannable layer,
# and a bad release fails the build rather than a sandbox creation.
# /usr/local/go/bin is already on the claude workload's PATH, so `go` is found
# with no profile.d or environment plumbing.
#
# The PostgreSQL client lives in the sibling psql kit; it takes a different
# route (an apt install hook) because apt packages cannot travel in an overlay.
schemaVersion: "3"
kind: mixin
displayName: Go toolchain
description: >-
  Installs a pinned Go release at /usr/local/go (on the claude image's PATH)
  and allows the Go module proxy and checksum database at runtime so `go mod
  download`, `go build` and `go test` can fetch dependencies.
sourceUrl: https://github.com/lmullen/dotfiles

# Versioned, so a kit asking for `go >= 1.25` resolves against the release the
# recipe actually installs. `version:` names the same arg, so the field and the
# provide cannot end up naming different Gos.
provides: ["go@${{ kit.args.version }}"]
version: "${{ kit.args.version }}"

# The Go release, pinned. Override at create with `--kit-arg version=1.27.3`
# or a kits[] entry's args in sbxenv.yaml. HOW TO BUMP THE DEFAULT: pick the
# release from https://go.dev/dl/ and edit this default together with the two
# digests in the pinned-digest table in go.dockerfile. For a release not in
# that table the recipe falls back to the .sha256 sidecar dl.google.com
# publishes next to each tarball.
#
# `buildArg` makes this a build-phase arg, which is what lets `provides` above
# reference it (a create-phase `env:` arg cannot be referenced from provides).
args:
  version:
    default: "1.26.10"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Go release to install from dl.google.com
    buildArg: GO_VERSION

# No `requires:`: the overlay lands on any glibc base.

capabilities:
  # No install phase: the download runs on the builder, which this policy does
  # not govern, and the kit has no install hook. An absent phase grants nothing.
  #
  # What a Go toolchain reaches at runtime: the module proxy that `go mod
  # download` and `go build` fetch dependencies from, and the checksum database
  # that verifies them. Without these a sandbox has `go` and can build nothing
  # that is not already in the module cache.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - proxy.golang.org
          - sum.golang.org

  # Appended to the agent's profile so the agent knows the toolchain is present
  # and where it lives. A mixin contributes a body only.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./go-context.md
